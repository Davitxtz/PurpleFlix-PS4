name: Build PurpleFlix PKG (container oficial OpenOrbis)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gerar ícone provisório
        run: |
          mkdir -p sce_sys
          python3 tools/make_icon.py sce_sys/icon0.png

      - name: Compilar no container oficial do OpenOrbis
        run: |
          docker run --rm --user root -w /workspace -v "$PWD":/workspace \
            openorbisofficial/toolchain:latest bash -c '
              set -e
              echo "OO_PS4_TOOLCHAIN=$OO_PS4_TOOLCHAIN"
              ls "$OO_PS4_TOOLCHAIN" | head -40
              echo "== SDL no toolchain =="
              find "$OO_PS4_TOOLCHAIN" \( -iname "libSDL2*" -o -iname "SDL.h" \) 2>/dev/null | head
              find_one() { find / -xdev -iname "$1" 2>/dev/null | head -1; }
              SPRX=$(find_one right.sprx)
              LIBC=$(find_one libc.prx)
              FIOS=$(find_one libSceFios2.prx)
              echo "right.sprx:      ${SPRX:-NENHUM}"
              echo "libc.prx:        ${LIBC:-NENHUM}"
              echo "libSceFios2.prx: ${FIOS:-NENHUM}"
              test -n "$SPRX"
              test -n "$LIBC"
              test -n "$FIOS"
              mkdir -p sce_sys/about sce_module
              cp "$SPRX" sce_sys/about/right.sprx
              cp "$LIBC" sce_module/libc.prx
              cp "$FIOS" sce_module/libSceFios2.prx
              make
            '

      - name: Coletar PKG
        run: |
          mkdir -p dist
          cp -v ./*.pkg dist/
          cd dist && sha256sum *.pkg > SHA256SUMS

      - name: Enviar artefato
        uses: actions/upload-artifact@v4
        with:
          name: PurpleFlix-PS4-pkg
          path: dist/
