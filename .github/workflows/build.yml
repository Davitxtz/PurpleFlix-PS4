name: Build PurpleFlix PKG (release oficial OpenOrbis v0.5.4)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar clang, lld e make
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld make python3 unzip

      - name: Baixar toolchain oficial (release v0.5.4)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p tc-dl tc
          gh release download v0.5.4 --repo OpenOrbis/OpenOrbis-PS4-Toolchain --dir tc-dl
          ls -la tc-dl
          for f in tc-dl/*; do
            case "$f" in
              *.tar.gz|*.tgz) tar xzf "$f" -C tc ;;
              *.zip) unzip -q "$f" -d tc ;;
            esac
          done
          LINKX=$(find tc -name link.x | head -1)
          echo "link.x em: ${LINKX:-NENHUM}"
          test -n "$LINKX"
          echo "OO_PS4_TOOLCHAIN=$(cd "$(dirname "$LINKX")" && pwd)" >> "$GITHUB_ENV"

      - name: Gerar ícone provisório
        run: |
          mkdir -p sce_sys
          python3 tools/make_icon.py sce_sys/icon0.png

      - name: Compilar o app principal e gerar pkg.gp4
        run: |
          set -e
          TC="$OO_PS4_TOOLCHAIN"
          echo "TOOLCHAIN=$TC"

          find_one() { find "$TC" -type f -iname "$1" 2>/dev/null | head -1; }

          SPRX=$(find_one right.sprx)
          LIBC=$(find_one libc.prx)
          FIOS=$(find_one libSceFios2.prx)
          FSELF="$TC/bin/linux/create-fself"
          GP4="$TC/bin/linux/create-gp4"
          PKGTOOL="$TC/bin/linux/PkgTool.Core"

          echo "right.sprx:      ${SPRX:-NENHUM}"
          echo "libc.prx:        ${LIBC:-NENHUM}"
          echo "libSceFios2.prx: ${FIOS:-NENHUM}"
          test -n "$SPRX"
          test -n "$LIBC"
          test -n "$FIOS"
          test -x "$FSELF"
          test -x "$GP4"
          test -x "$PKGTOOL"

          mkdir -p sce_sys/about sce_module
          cp "$SPRX" sce_sys/about/right.sprx
          cp "$LIBC" sce_module/libc.prx
          cp "$FIOS" sce_module/libSceFios2.prx

          echo "FSELF=$FSELF" >> "$GITHUB_ENV"
          echo "GP4=$GP4" >> "$GITHUB_ENV"
          echo "PKGTOOL=$PKGTOOL" >> "$GITHUB_ENV"

          make pkg.gp4 FSELF="$FSELF" GP4="$GP4" PKGTOOL="$PKGTOOL"
          echo "== pkg.gp4 =="
          cat pkg.gp4

      - name: Gerar PKG do app principal (container com OpenSSL antigo)
        run: |
          docker run --rm --user root \
            -e DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1 \
            -w /workspace -v "$PWD":/workspace \
            openorbisofficial/toolchain:latest \
            bash -c '/workspace/tc/OpenOrbis/PS4Toolchain/bin/linux/PkgTool.Core pkg_build pkg.gp4 .'
          ls -l ./*.pkg

      - name: Compilar o PurpleFlix Probe e gerar pkg.gp4
        run: |
          set -e
          rm -f eboot.bin pkg.gp4 sce_sys/param.sfo
          make INTDIR=build-probe SRCDIR=probe PROJ=probe \
            TITLE='PurpleFlix Probe' VERSION=01.00 TITLE_ID=PFLX00003 \
            CONTENT_ID=IV0000-PFLX00003_00-PURPLEPROBE00000 \
            FSELF="$FSELF" GP4="$GP4" PKGTOOL="$PKGTOOL" pkg.gp4
          echo "== pkg.gp4 do probe =="
          cat pkg.gp4

      - name: Gerar PKG do Probe (container)
        run: |
          docker run --rm --user root \
            -e DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1 \
            -w /workspace -v "$PWD":/workspace \
            openorbisofficial/toolchain:latest \
            bash -c '/workspace/tc/OpenOrbis/PS4Toolchain/bin/linux/PkgTool.Core pkg_build pkg.gp4 .'
          ls -l ./*.pkg

      - name: Coletar PKGs
        run: |
          mkdir -p dist
          cp -v ./*.pkg dist/
          cd dist && sha256sum *.pkg > SHA256SUMS

      - name: Enviar artefato
        uses: actions/upload-artifact@v4
        with:
          name: PurpleFlix-PS4-pkg
          path: dist/
